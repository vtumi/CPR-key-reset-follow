[package]
name = "key-reset-follow"
version = "0.1.7"
authors = ["tumi"]
edition = "2024"
license = "Apache-2.0"

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs", rev = "8c8618aa0f841638262262e3338c115bc075f125", features = ["io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "sync", "time"] }

[[example]]
name = "fault-proxy"
path = "tests/support/fault_proxy.rs"
